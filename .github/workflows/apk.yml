name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the same page as the website
        run: cp index.html android/app/src/main/assets/index.html

      - name: Verify UI JavaScript and alert settings
        run: python3 tools/check_embedded_js.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk poc-signal.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest poc-signal.apk --target "$GITHUB_SHA" \
            --title "POC Signal APK" \
            --notes "Android app (same as the website). Download poc-signal.apk on the phone, open it, and allow installing from this source. Backtest/signal tool only; it never places orders."
