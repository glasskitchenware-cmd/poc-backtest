name: Android E2E (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "web/**", "index.html", "tests/**", ".github/workflows/android-e2e.yml"]

permissions:
  contents: write

concurrency:
  group: android-e2e
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Real candles for the mock server (ETHUSDT 15m, official archive)
        working-directory: tests/e2e
        run: |
          python -m pip install requests
          python ../../research/evidence/fetch.py ETHUSDT 15m
          node find_signal.js bars/ETHUSDT_15m.json

      - name: Start mock USD-M futures API
        working-directory: tests/e2e
        run: |
          nohup python mock_server.py replay.json > mock.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8765/fapi/v1/time

      - name: Build debug APK (with test hooks)
        run: |
          python3 tools/build_web.py --check
          cp index.html android/app/src/main/assets/index.html
          cd android && gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/e2e/run_e2e.sh

      - name: Publish evidence (screenshots + log) to the e2e-evidence release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tests/e2e/mock.log tests/e2e/out/ 2>/dev/null || true
          ls -la tests/e2e/out || true
          gh release delete e2e-evidence --yes --cleanup-tag || true
          # GitHub rejects empty assets; an empty crash log means "no crash" and is noted in e2e.log.
          find tests/e2e/out -type f -size 0 -print -delete
          gh release create e2e-evidence tests/e2e/out/* --target "$GITHUB_SHA" --prerelease \
            --title "Android E2E evidence" --notes "Emulator run ${{ github.run_id }} on ${{ github.sha }}. Screenshots and log of tests/e2e/run_e2e.sh." || true
