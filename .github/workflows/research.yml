name: Research backtest (MTF 10,000)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "mtf10000, skills, evidence, tune, pro, robust, sentiment, meanrev, improve, tf, winrate, signalscore, liveodds, pyramid or newsprobe"
        default: "skills"

jobs:
  skills:
    if: ${{ inputs.job == 'skills' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: research/skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - run: python fetch.py
      - run: node --max-old-space-size=6000 run_skills.js

  evidence:
    if: ${{ inputs.job == 'evidence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: research/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 5m,15m,1h
      - run: node --max-old-space-size=6000 evidence.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 5m,15m,1h

  tune:
    if: ${{ inputs.job == 'tune' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 1h,4h
      - working-directory: research/tune
        run: node --max-old-space-size=6000 tune.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT

  pro:
    if: ${{ inputs.job == 'pro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h,1d 2020-01
      - working-directory: research/pro
        run: node --max-old-space-size=6000 pro.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT
      - name: Publish the evidence JSON (branch research-results, and release research-pro) for web/evidence_trend.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp research/pro/evidence_trend.json /tmp/evidence_trend.json
          bash .github/publish_result.sh pro /tmp/evidence_trend.json
          gh release delete research-pro --yes --cleanup-tag || true
          gh release create research-pro research/pro/evidence_trend.json --target "$GITHUB_SHA" --prerelease \
            --title "research/pro evidence" --notes "Run ${{ github.run_id }} on $GITHUB_SHA" || echo "release not created (result is on branch research-results)"

  robust:
    if: ${{ inputs.job == 'robust' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: Bars - the 12 coins, 25 coins the rule never saw (some delisted since), spot 2017-2019
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h 2020-01
          python fetch.py ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT 4h 2017-08 2019-12 spot
      - working-directory: research/pro
        run: node --max-old-space-size=6000 robust.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT
      - name: Publish robust.json (branch research-results)
        run: |
          cp research/pro/robust.json /tmp/robust.json
          bash .github/publish_result.sh robust /tmp/robust.json

  sentiment:
    # Trend 4H against the Crypto Fear & Greed Index history (research/pro/sentiment.js).
    if: ${{ inputs.job == 'sentiment' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h 2020-01
          curl -sfL --retry 3 "https://api.alternative.me/fng/?limit=0&format=json" -o fng.json
          python -c "import json; d=json.load(open('fng.json'))['data']; print(len(d), 'days of Fear & Greed')"
      - working-directory: research/pro
        run: node sentiment.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT
      - name: Publish sentiment.json (branch research-results)
        run: |
          cp research/pro/sentiment.json /tmp/sentiment.json
          bash .github/publish_result.sh sentiment /tmp/sentiment.json

  meanrev:
    # A second rule with a higher win rate (mean reversion inside the trend), walk-forward, to pair with Trend 4H.
    if: ${{ inputs.job == 'meanrev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h,1d 2020-01
          python fetch.py ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h,1d 2020-01
      - working-directory: research/pro
        run: node --max-old-space-size=6000 meanrev.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT
      - name: Publish meanrev.json (branch research-results)
        run: |
          cp research/pro/meanrev.json /tmp/meanrev.json
          bash .github/publish_result.sh meanrev /tmp/meanrev.json

  improve:
    # Can Trend 4H be made better (entry filters, the rest after TP1, how many coins), checks fixed before the run.
    if: ${{ inputs.job == 'improve' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: Bars (the 12 coins, 25 unseen coins, spot 2017-2019) and the Fear & Greed history
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h 2020-01
          python fetch.py ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT 4h 2017-08 2019-12 spot
          curl -sfL --retry 3 "https://api.alternative.me/fng/?limit=0&format=json" -o fng.json
          python -c "import json; d=json.load(open('fng.json'))['data']; print(len(d), 'days of Fear & Greed')"
      - working-directory: research/pro
        run: node --max-old-space-size=6000 improve.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT
      - name: Publish improve.json (branch research-results)
        run: |
          cp research/pro/improve.json /tmp/improve.json
          bash .github/publish_result.sh improve /tmp/improve.json

  tf:
    # The Trend rule family on 15m / 30m / 1h / 2h (signals more often than every 4 hours), research/pro/tf.js.
    if: ${{ inputs.job == 'tf' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: 15m bars (12 coins and 25 unseen coins, 4 downloads at once) and the 12 coins' 4h bars
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT 15m 2020-01 > f1.log 2>&1 &
          python fetch.py ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 15m 2020-01 > f2.log 2>&1 &
          python fetch.py ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT 15m 2020-01 > f3.log 2>&1 &
          python fetch.py SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 15m 2020-01 > f4.log 2>&1 &
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h 2020-01 > f5.log 2>&1 &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done
          cat f1.log f2.log f3.log f4.log f5.log
          exit $fail
      - working-directory: research/pro
        run: node --max-old-space-size=6000 tf.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT
      - name: Publish tf.json (branch research-results)
        run: |
          cp research/pro/tf.json /tmp/tf.json
          bash .github/publish_result.sh tf /tmp/tf.json

  winrate:
    # Do high-win-rate coins stay high-win-rate (research/pro/winrate.js)?
    if: ${{ inputs.job == 'winrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: 4h bars, the 12 coins and the 25 unseen coins (2 downloads at once)
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT 4h 2020-01 > f1.log 2>&1 &
          python fetch.py FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01 > f2.log 2>&1 &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done
          cat f1.log f2.log
          exit $fail
      - working-directory: research/pro
        run: node winrate.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT
      - name: Publish winrate.json (branch research-results)
        run: |
          cp research/pro/winrate.json /tmp/winrate.json
          bash .github/publish_result.sh winrate /tmp/winrate.json

  signalscore:
    # A confidence tier per signal from what is known at the signal, fitted on 2020-2022 (research/pro/signalscore.js).
    if: ${{ inputs.job == 'signalscore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: 4h bars (12 coins, 25 unseen coins, spot 2017-2019) and the Fear & Greed history, 3 downloads at once
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT 4h 2020-01 > f1.log 2>&1 &
          python fetch.py FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01 > f2.log 2>&1 &
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT 4h 2017-08 2019-12 spot > f3.log 2>&1 &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done
          cat f1.log f2.log f3.log
          curl -sfL --retry 3 "https://api.alternative.me/fng/?limit=0&format=json" -o fng.json
          exit $fail
      - working-directory: research/pro
        run: node signalscore.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT
      - name: Publish signalscore.json (branch research-results)
        run: |
          cp research/pro/signalscore.json /tmp/signalscore.json
          bash .github/publish_result.sh signalscore /tmp/signalscore.json

  liveodds:
    # How often an open trade at a given R ended in profit (research/pro/liveodds.js).
    if: ${{ inputs.job == 'liveodds' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT 4h 2020-01 > f1.log 2>&1 &
          python fetch.py FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01 > f2.log 2>&1 &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done
          cat f1.log f2.log; exit $fail
      - working-directory: research/pro
        run: node liveodds.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT
      - name: Publish liveodds.json (branch research-results)
        run: |
          cp research/pro/liveodds.json /tmp/liveodds.json
          bash .github/publish_result.sh liveodds /tmp/liveodds.json

  pyramid:
    # Adding to winning Trend 4H trades (research/pro/pyramid.js).
    if: ${{ inputs.job == 'pyramid' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - name: 4h bars (12 coins, 25 unseen coins, spot 2017-2019) and the Fear & Greed history, 3 downloads at once
        working-directory: research/evidence
        run: |
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT,ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT 4h 2020-01 > f1.log 2>&1 &
          python fetch.py FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT 4h 2020-01 > f2.log 2>&1 &
          python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT 4h 2017-08 2019-12 spot > f3.log 2>&1 &
          fail=0; for j in $(jobs -p); do wait $j || fail=1; done
          cat f1.log f2.log f3.log
          curl -sfL --retry 3 "https://api.alternative.me/fng/?limit=0&format=json" -o fng.json
          exit $fail
      - working-directory: research/pro
        run: node pyramid.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT ETCUSDT,BCHUSDT,XLMUSDT,EOSUSDT,ATOMUSDT,NEARUSDT,FILUSDT,AAVEUSDT,UNIUSDT,ALGOUSDT,MATICUSDT,FTMUSDT,SANDUSDT,MANAUSDT,AXSUSDT,ICPUSDT,APTUSDT,OPUSDT,ARBUSDT,INJUSDT,SUIUSDT,XTZUSDT,THETAUSDT,VETUSDT,ZECUSDT BTCUSDT,ETHUSDT,BNBUSDT,LTCUSDT,XRPUSDT,ADAUSDT,TRXUSDT,LINKUSDT,DOGEUSDT,EOSUSDT,ETCUSDT,XLMUSDT,NEOUSDT,IOTAUSDT,ONTUSDT
      - name: Publish pyramid.json (branch research-results)
        run: |
          cp research/pro/pyramid.json /tmp/pyramid.json
          bash .github/publish_result.sh pyramid /tmp/pyramid.json

  newsprobe:
    # Which free news sources answer a plain app request (no browser, no key), and what they return.
    if: ${{ inputs.job == 'newsprobe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch each source once
        run: |
          mkdir out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36 POCSignal"
          i=0
          for u in https://www.coindesk.com/arc/outboundfeeds/rss/ https://cointelegraph.com/rss https://decrypt.co/feed https://bitcoinmagazine.com/feed \
                   https://www.theblock.co/rss.xml https://siamblockchain.com/feed/ https://bitcoinaddict.org/feed/ https://cryptoslate.com/feed/ \
                   https://nfs.faireconomy.media/ff_calendar_thisweek.json \
                   "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=5" \
                   "https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query?catalogId=161&pageNo=1&pageSize=5" \
                   https://www.federalreserve.gov/feeds/press_all.xml https://www.sec.gov/news/pressreleases.rss; do
            i=$((i+1))
            code=$(curl -sL -m 25 -A "$UA" -o "out/$i.body" -w "%{http_code} %{content_type} %{size_download} %{url_effective}" "$u" || echo "fail")
            echo "$i $u -> $code" | tee -a out/summary.txt
            head -c 3000 "out/$i.body" > "out/$i.head.txt" 2>/dev/null || true
            rm -f "out/$i.body"
          done
      - name: Publish (release news-probe)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find out -type f -size 0 -delete
          gh release delete news-probe --yes --cleanup-tag || true
          gh release create news-probe out/* --target "$GITHUB_SHA" --prerelease --title "news sources probe" --notes "Run ${{ github.run_id }}"

  mtf10000:
    if: ${{ inputs.job == 'mtf10000' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: research/mtf10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements_crypto_mtf.txt
      - run: python CRYPTO_MTF_10000_M5_M15_V3.py --selftest
      - run: python CRYPTO_MTF_10000_M5_M15_V3.py
      - run: python summarize.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf10000-results
          path: research/mtf10000/CRYPTO_MTF_10000_RESULTS
          if-no-files-found: warn
