name: Research backtest (MTF 10,000)

on:
  workflow_dispatch:
    inputs:
      job:
        description: "mtf10000, skills, evidence, tune or pro"
        default: "skills"

jobs:
  skills:
    if: ${{ inputs.job == 'skills' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: research/skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - run: python fetch.py
      - run: node --max-old-space-size=6000 run_skills.js

  evidence:
    if: ${{ inputs.job == 'evidence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: research/evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 5m,15m,1h
      - run: node --max-old-space-size=6000 evidence.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 5m,15m,1h

  tune:
    if: ${{ inputs.job == 'tune' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 1h,4h
      - working-directory: research/tune
        run: node --max-old-space-size=6000 tune.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT

  pro:
    if: ${{ inputs.job == 'pro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install requests
      - working-directory: research/evidence
        run: python fetch.py BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT 4h,1d 2020-01
      - working-directory: research/pro
        run: node --max-old-space-size=6000 pro.js BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,TRXUSDT,LTCUSDT

  mtf10000:
    if: ${{ inputs.job == 'mtf10000' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: research/mtf10000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements_crypto_mtf.txt
      - run: python CRYPTO_MTF_10000_M5_M15_V3.py --selftest
      - run: python CRYPTO_MTF_10000_M5_M15_V3.py
      - run: python summarize.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtf10000-results
          path: research/mtf10000/CRYPTO_MTF_10000_RESULTS
          if-no-files-found: warn
